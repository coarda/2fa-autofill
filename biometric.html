<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2FA Autofill – Fingerprint</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-height: none; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .box { width: 340px; text-align: center; padding: 24px 20px; }
    .finger { width: 64px; height: 64px; margin: 0 auto 6px; border-radius: 18px; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent); }
    .finger svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .box.ok .finger { color: #1f8a4c; }
    #message { margin: 6px 0 16px; color: var(--muted); }
    .warn { text-align: left; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 12px; margin: 0 0 14px; }
    .btns { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <div class="box" id="box">
    <div class="finger">
      <svg viewBox="0 0 24 24"><path d="M12 11v3a8 8 0 0 1-1.5 4.7"/><path d="M8.5 9.5A3.5 3.5 0 0 1 15.5 10v2.5c0 2-.4 3.9-1.2 5.6"/><path d="M5.6 7.5A7.5 7.5 0 0 1 19.5 11v1.5c0 1.6-.2 3.1-.6 4.5"/><path d="M5 11.5v.5c0 1.5-.4 2.9-1 4.2"/><path d="M8.8 4.6A7.5 7.5 0 0 1 17.6 5"/><path d="M8.5 13v.5c0 1.8-.5 3.5-1.4 4.9"/></svg>
    </div>
    <h1 id="title">Fingerprint unlock</h1>
    <p id="message">Starting…</p>
    <p class="warn" id="warn" hidden></p>
    <div class="btns">
      <button class="primary" id="retry" type="button" hidden>Try again</button>
      <button class="primary" id="weak-yes" type="button" hidden>Turn on anyway</button>
      <button id="use-password" type="button" hidden>Use master password instead</button>
      <button id="close" type="button">Close</button>
    </div>
  </div>
  <script type="module" src="biometric.js"></script>
</body>
</html>
